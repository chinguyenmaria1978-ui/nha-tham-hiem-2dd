
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhà Thám Hiểm 2D</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #101827; color: white;
    font-family: Arial, sans-serif; text-align: center;
  }
  h1 { color: #facc15; }
  p { line-height: 1.6; }
  canvas {
    display: block; width: 100%; max-width: 800px;
    margin: 20px auto; border: 3px solid #64748b;
    border-radius: 10px; background: #93c5fd;
  }
  button {
    padding: 12px 22px; margin: 5px;
    border: 0; border-radius: 8px;
    background: #facc15; font-size: 16px;
    font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
<h1>🏝️ NHÀ THÁM HIỂM 2D</h1>
<p>Di chuyển: ← → hoặc A, D | Nhảy: Space, W hoặc ↑</p>
<p>🪙 Xu: <span id="score">0</span> / 5</p>
<canvas id="game" width="800" height="450"></canvas>
<button onclick="restart()">🔄 Chơi lại</button>
<p id="message">Hãy nhặt xu và tìm đến cánh cổng màu xanh!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

const groundY = 400;
const platforms = [
  {x:0, y:400, w:800, h:50},
  {x:145, y:325, w:115, h:16},
  {x:310, y:265, w:120, h:16},
  {x:475, y:320, w:110, h:16},
  {x:620, y:250, w:115, h:16}
];
const coinStarts = [
  {x:185,y:290}, {x:350,y:230}, {x:515,y:285},
  {x:665,y:215}, {x:745,y:365}
];
const spikes = [
  {x:275,y:382,w:36,h:18},
  {x:440,y:382,w:36,h:18},
  {x:585,y:382,w:36,h:18}
];
let player, coins, score, ended, won, keys;

function restart() {
  player = {x:35, y:350, w:28, h:38, vx:0, vy:0, grounded:false};
  coins = coinStarts.map(c => ({...c, got:false}));
  score = 0;
  ended = false;
  won = false;
  keys = {};
  scoreText.textContent = score;
  message.textContent = "Hãy nhặt xu và tìm đến cánh cổng màu xanh!";
}
document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))
    e.preventDefault();
  keys[e.code] = true;
  if (!e.repeat && ["Space","ArrowUp","KeyW"].includes(e.code)
      && player && player.grounded && !ended) {
    player.vy = -11.5;
    player.grounded = false;
  }
  if (e.code === "KeyR") restart();
});
document.addEventListener("keyup", e => keys[e.code] = false);

function overlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

function update() {
  if (ended) return;
  player.vx = 0;
  if (keys.ArrowLeft || keys.KeyA) player.vx = -4;
  if (keys.ArrowRight || keys.KeyD) player.vx = 4;

  player.x += player.vx;
  player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));

  const oldBottom = player.y + player.h;
  player.vy += 0.5;
  player.y += player.vy;
  player.grounded = false;

  for (const p of platforms) {
    if (player.vy >= 0 && oldBottom <= p.y &&
        player.y + player.h >= p.y &&
        player.x + player.w > p.x && player.x < p.x+p.w) {
      player.y = p.y-player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  for (const c of coins) {
    if (!c.got && overlap(player,
        {x:c.x-10,y:c.y-10,w:20,h:20})) {
      c.got = true;
      score++;
      scoreText.textContent = score;
    }
  }

  for (const s of spikes) {
    if (overlap(player,s)) {
      ended = true;
      message.textContent = "💥 Bạn chạm gai rồi! Nhấn Chơi lại để thử lần nữa.";
    }
  }

  if (player.y > canvas.height) {
    ended = true;
    message.textContent = "Bạn bị rơi! Nhấn Chơi lại nhé.";
  }

  if (player.x > 745 && player.y + player.h >= groundY-2) {
    ended = true;
    won = true;
    message.textContent = score === coinStarts.length
      ? "🎉 Tuyệt vời! Bạn thắng và đã nhặt đủ 5 xu!"
      : "🏆 Bạn đã đến đích! Thử chơi lại để nhặt đủ 5 xu nhé.";
  }
}

function draw() {
  const sky = ctx.createLinearGradient(0,0,0,450);
  sky.addColorStop(0,"#7dd3fc");
  sky.addColorStop(1,"#dbeafe");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,800,450);

  // Mây
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (const [x,y] of [[100,75],[340,105],[600,65]]) {
    ctx.beginPath();
    ctx.arc(x,y,20,0,Math.PI*2);
    ctx.arc(x+23,y-8,26,0,Math.PI*2);
    ctx.arc(x+48,y,19,0,Math.PI*2);
    ctx.fill();
  }

  // Mặt đất và các bục nhảy
  for (const p of platforms) {
    ctx.fillStyle = "#854d0e";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(p.x,p.y,p.w,7);
  }

  // Gai nguy hiểm
  for (const s of spikes) {
    ctx.fillStyle = "#dc2626";
    ctx.beginPath();
    ctx.moveTo(s.x,s.y+s.h);
    ctx.lineTo(s.x+s.w/2,s.y);
    ctx.lineTo(s.x+s.w,s.y+s.h);
    ctx.fill();
  }

  // Cổng đích
  ctx.fillStyle = "#166534";
  ctx.fillRect(750,330,12,70);
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(762,330,25,30);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 13px Arial";
  ctx.fillText("ĐÍCH",760,350);

  // Xu vàng
  for (const c of coins) {
    if (c.got) continue;
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(c.x,c.y,10,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#ca8a04";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px Arial";
    ctx.fillText("$",c.x-4,c.y+4);
  }

  // Nhân vật
  ctx.fillStyle = "#2563eb";
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle = "#fde68a";
  ctx.fillRect(player.x+4,player.y+4,20,15);
  ctx.fillStyle = "#111827";
  ctx.fillRect(player.x+17,player.y+8,4,5);
  ctx.fillStyle = "#1e40af";
  ctx.fillRect(player.x+3,player.y+player.h-5,8,5);
  ctx.fillRect(player.x+18,player.y+player.h-5,8,5);

  if (ended) {
    ctx.fillStyle = "rgba(15,23,42,0.65)";
    ctx.fillRect(180,155,440,90);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText(won ? "BẠN ĐÃ CHIẾN THẮNG!" : "GAME OVER",400,210);
    ctx.textAlign = "left";
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
restart();
loop();
</script>
</body>
</html>
